# Project-scoped Codex MCP configuration for Poza Nutą.
# This file must not contain API keys, tokens or credentials.

[mcp_servers.next-devtools]
command = "cmd.exe"
args = ["/d", "/s", "/c", "npx.cmd", "-y", "next-devtools-mcp@latest"]
startup_timeout_sec = 120
tool_timeout_sec = 120
default_tools_approval_mode = "prompt"

[mcp_servers.supabase-dev]
url = "https://mcp.supabase.com/mcp?project_ref=qwmimnhdnzqfckswxjww&features=database,docs,debugging,development"
startup_timeout_sec = 120
tool_timeout_sec = 120
default_tools_approval_mode = "auto"

[mcp_servers.supabase-dev.tools.apply_migration]
approval_mode = "prompt"

[mcp_servers.supabase-dev.tools.execute_sql]
approval_mode = "prompt"

[mcp_servers.shadcn]
command = "cmd.exe"
args = ["/d", "/s", "/c", "npx.cmd", "-y", "shadcn@latest", "mcp"]
startup_timeout_sec = 120
tool_timeout_sec = 60
default_tools_approval_mode = "prompt"
